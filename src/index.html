<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sermon Translator">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Sermon Translator – Swiss German → English (on-device)</title>
</head>
<body class="mode-sermon">
<main id="app">
  <header>
    <h1>🇨🇭 → 🇬🇧 <span id="modeTitle">Sermon</span> <small class="badge">on-device</small></h1>
    <button id="settingsBtn" aria-expanded="false" aria-controls="settings" title="Settings">⚙︎</button>
  </header>

  <!-- ===== Setup / download screen (shown until a model is ready) ===== -->
  <section id="setup">
    <h2>One-time setup</h2>
    <p>The translator runs <b>entirely on this device</b>. It needs to download its AI model once
       (then it works offline). Use Wi-Fi.</p>
    <label>Model <select id="modelPick"></select></label>
    <p id="modelNote" class="note"></p>
    <p id="deviceInfo" class="note"></p>
    <button id="downloadBtn" class="big">⬇ Download &amp; prepare</button>
    <div id="progress" hidden>
      <div class="bar"><div id="barFill"></div></div>
      <p id="progressText" class="note">Starting…</p>
    </div>
  </section>

  <!-- ===== Settings (hidden by default so the screen stays simple) ===== -->
  <section id="settings" hidden>
    <label>Screen
      <select id="mode">
        <option value="sermon">Sermon (big English only)</option>
        <option value="conversation">Conversation (English + German)</option>
      </select>
    </label>
    <label>Listening engine
      <select id="engine">
        <option value="whisper">On-device Whisper (private, offline)</option>
        <option value="webspeech">Browser speech – may send audio to Apple/Google servers</option>
      </select>
    </label>
    <label>Model <select id="modelSetting"></select></label>
    <label>Translation method
      <select id="task">
        <option value="mt">German text → English translator (recommended)</option>
        <option value="translate">Whisper translates directly (smaller download)</option>
      </select>
    </label>
    <label><input type="checkbox" id="showDe"> Show German text</label>
    <label>Test with an audio file <input type="file" id="testFile" accept="audio/*"></label>
    <div class="row">
      <button id="size">Text size A±</button>
      <button id="clear">Clear</button>
      <button id="reloadModel">Apply model</button>
    </div>
    <p id="engineInfo" class="note"></p>
  </section>

  <div id="status" role="status">Preparing…</div>
  <div id="meter" aria-hidden="true"><div id="meterFill"></div></div>

  <!-- Finished sentences; auto-scrolls to the newest line -->
  <section id="log" aria-label="Translation" aria-live="polite"></section>
  <section id="live"><p id="interimEn" class="en interim"></p><p id="interimDe" class="de interim"></p></section>
  <button id="jump" hidden>↓ Back to live</button>

  <footer>
    <button id="toggle" class="start" disabled>▶ Start translating</button>
    <label class="readaloud"><input type="checkbox" id="speak"> 🎧 Read aloud (use earphones)</label>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>

<!-- Sermon Translator (Swiss German -> English, runs on the visitor's device).
     Live address of the GitHub Pages site.
     allow="microphone" is REQUIRED; the host page must be HTTPS.
     Note: inside an iframe the AI usually runs single-threaded (slower) unless the host page is
     itself cross-origin isolated. For best speed, link to the page directly or open it full screen. -->
<div style="position:relative;width:100%;max-width:720px;height:85vh;min-height:520px;margin:auto">
  <iframe src="https://famswinkler.github.io/swiss-translator/"
          title="Swiss German to English live captions"
          allow="microphone; screen-wake-lock; cross-origin-isolated"
          style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:16px"></iframe>
</div>
<p><a href="https://famswinkler.github.io/swiss-translator/" target="_blank" rel="noopener">Open full screen</a></p>
